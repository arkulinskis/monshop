<div class="ms-card tight wr-row">
  <div class="wr-n" anvil:dom-node="count"></div>
  <div class="grow">
    <b class="nm" anvil:dom-node="name"></b>
    <div class="small muted" anvil:dom-node="meta"></div>
    <div class="small" anvil:dom-node="joined"></div>
    <a class="small" target="_blank" rel="noopener" anvil:dom-node="osm">See it on OpenStreetMap ↗</a>
  </div>
  <anvil-component type="Button" name="copy_button" prop:text="📋 Copy invite" prop:role='["ms-btn", "ghost", "sm"]'></anvil-component>
</div>
