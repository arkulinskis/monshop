<div class="ms-card tight sv-row">
  <a class="mp-card sv-card" anvil:name="card">
    <div class="pic sv-pic" anvil:dom-node="pic"><span anvil:dom-node="pic_emo" aria-hidden="true"></span></div>
    <div class="grow"><h4 anvil:dom-node="name"></h4>
      <div class="meta" anvil:dom-node="meta"></div>
      <div class="special" anvil:dom-node="special"></div>
    </div>
  </a>
  <div class="row">
    <anvil-component type="Button" name="pass_button" prop:text="🎟️ Show my 5% pass" prop:role='["ms-btn", "ink"]'></anvil-component>
    <anvil-component type="Button" name="remove_button" prop:text="✕" prop:role='["ms-icon-btn"]' prop:tooltip="Remove bookmark"></anvil-component>
  </div>
</div>
