<div class="hr-row" anvil:dom-node="row">
  <span class="hr-day" anvil:dom-node="day"></span>
  <div class="hr-times" anvil:dom-node="times">
    <span class="hr-pair"><input type="time" class="ms-time" anvil:dom-node="o1"><span class="hr-dash" aria-hidden="true">–</span><input type="time" class="ms-time" anvil:dom-node="c1"></span>
    <span class="hr-pair" anvil:dom-node="second"><span class="hr-and">and</span><input type="time" class="ms-time" anvil:dom-node="o2"><span class="hr-dash" aria-hidden="true">–</span><input type="time" class="ms-time" anvil:dom-node="c2"></span>
    <button type="button" class="hr-add" anvil:dom-node="add">＋ Break</button>
  </div>
  <span class="hr-off" anvil:dom-node="off">Closed all day</span>
  <label class="hr-closed"><input type="checkbox" anvil:dom-node="closed"><span>Closed</span></label>
</div>
