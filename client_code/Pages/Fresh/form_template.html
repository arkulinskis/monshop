<anvil-form layout="MonShop.Layouts.Shell">
  <anvil-block slot="content">
    <div class="ms-page">
      <div class="fr-head">
        <div><h1 class="page-h1">What's fresh on the shelves near you</h1>
          <p class="muted fr-sub">Newest first. No algorithm, just time and distance.</p></div>
        <anvil-component type="Button" name="me_button" prop:text="📍 Use my location" prop:role='["ms-btn", "ghost", "sm"]'></anvil-component>
      </div>
      <anvil-component type="RepeatingPanel" name="filter_panel" prop:item_template="MonShop.Items.Chip" prop:role='["ms-chips", "scroll", "fr-chips"]'></anvil-component>
      <anvil-component type="RepeatingPanel" name="grid_panel" prop:item_template="MonShop.Items.FreshCard" prop:role='["fr-grid"]'></anvil-component>
      <div class="ms-empty" anvil:name="loading_box"><span class="big" aria-hidden="true">✨</span><p>Looking for fresh posts…</p></div>
      <div class="ms-empty" anvil:name="error_box"><span class="big" aria-hidden="true">📡</span><h2>Couldn't load the feed</h2><p class="muted">Check your connection and try again.</p></div>
      <div class="ms-empty" anvil:name="empty_box"><span class="big" aria-hidden="true">🌱</span><h2>Nothing posted within 15 km yet</h2>
        <p class="muted">MonShop is growing street by street. Peek at the demo street while you wait?</p>
        <anvil-component type="Button" name="demo_button" prop:text="👀 Show me the demo street" prop:role='["ms-btn"]'></anvil-component>
      </div>
    </div>
  </anvil-block>
</anvil-form>
