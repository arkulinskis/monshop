<div class="ui ms-dlg">
  <div class="ms-auth" anvil:name="box">
    <div class="head"><img src="_/theme/logo.svg" alt="" width="58" height="58">
      <anvil-component type="Label" name="title" prop:role='["ms-modal-title"]'></anvil-component>
      <anvil-component type="Label" name="sub" prop:role='["ms-modal-sub"]'></anvil-component>
    </div>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <label class="ms-field" anvil:name="name_field"><span class="lbl">What should we call you?</span>
      <anvil-component type="TextBox" name="name_box" prop:placeholder="First name is fine" prop:role='["ms-input"]'></anvil-component>
    </label>
    <label class="ms-field"><span class="lbl">Email</span>
      <anvil-component type="TextBox" name="email_box" prop:type="email" prop:placeholder="you@example.com" prop:role='["ms-input"]'></anvil-component>
    </label>
    <label class="ms-field" anvil:name="password_field"><span class="lbl">Password</span>
      <anvil-component type="TextBox" name="password_box" prop:hide_text="true" prop:placeholder="8+ characters" prop:role='["ms-input"]'></anvil-component>
    </label>
    <div anvil:name="consent_box" anvil:dom-node="consent"></div>
    <anvil-component type="Button" name="go_button" prop:text="Sign in" prop:role='["ms-btn", "lg", "block"]'></anvil-component>
    <div anvil:name="google_part">
      <div class="au-or">or</div>
      <anvil-component type="Button" name="google_button" prop:text="Continue with Google" prop:icon="_/theme/google-g.svg" prop:role='["ms-btn", "lg", "block", "ghost", "au-google"]'></anvil-component>
    </div>
    <div class="switch">
      <anvil-component type="Label" name="switch_text" prop:role='["inline"]'></anvil-component>
      <anvil-component type="Button" name="switch_button" prop:role='["ms-link"]'></anvil-component>
      <div class="f-forgot" anvil:name="forgot_part">
        <anvil-component type="Button" name="forgot_button" prop:text="Forgot your password?" prop:role='["ms-link"]'></anvil-component>
      </div>
      <div class="f-forgot" anvil:name="back_part">
        <anvil-component type="Button" name="back_button" prop:text="Back to sign in" prop:role='["ms-link"]'></anvil-component>
      </div>
    </div>
  </div>
</div>
