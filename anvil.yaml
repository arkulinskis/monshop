metadata: {title: MonShop, description: 'The shops on your street, open. See what independent shops, cafés and restaurants near you have today, and get 5% off where you are a regular.', logo_img: 'asset:favicon.png'}
name: MonShop
native_deps:
  head_html: |-
    <meta name="description" content="MonShop: see what the independent shops, cafés and restaurants around you have today. Bookmark a place, get 5% off.">
    <meta name="theme-color" content="#FFF8EF">
    <link rel="icon" type="image/svg+xml" href="_/theme/logo.svg">
    <link rel="icon" type="image/png" href="_/theme/favicon.png">
    <link rel="apple-touch-icon" href="_/theme/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,700&family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
    <link rel="stylesheet" href="_/theme/theme.css">
    <script src="_/theme/monshop.js"></script>
package_name: MonShop
runtime_options:
  client_version: '3'
  server_spec: {base: python314}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {auto_create_missing_columns: true}
  source: /runtime/services/tables.yml
- client_config: {allow_remember_me: true, allow_signup: true, confirm_email: false, enable_automatically: true, remember_me_days: 30, require_secure_passwords: false, use_email: true, use_google: false}
  server_config: {user_table: users}
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/anvil/email.yml
startup: {module: Main, type: form}
