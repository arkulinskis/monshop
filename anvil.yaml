  logo_img: asset:favicon.png
  title: 'MonShop: the independent shops on your street, open'
name: MonShop
native_deps:
  head_html: |-
    <!-- Prepsto feedback panel (the only feedback channel): every Submit feedback link (data-prepsto-open) opens it -->
    <script src="https://prepsto.com/_/theme/widget.js" data-prepsto="n3hxrpp" data-button="false" data-label="Submit feedback" async></script>
    <script src="_/theme/legal-kit.js?v=2dabb03e0d"></script>
    <!-- seo:start (APP_MAKER/seo: edit seo/apps/monshop.json and run seo.py, not here) -->
    <link rel="canonical" href="https://monshop.ca/">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="keywords" content="shop local app, independent shops near me, local cafés and restaurants, daily specials near me, neighbourhood shops map, loyalty discount, small business marketing app, support local business, boutiques près de chez moi">
    <meta name="author" content="Arkvital">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MonShop">
    <meta property="og:title" content="MonShop: the independent shops on your street, open">
    <meta property="og:description" content="See what independent shops, cafés and restaurants near you have today, from real shelf photos and specials, and get 5% off where you are a regular.">
    <meta property="og:locale" content="en_CA">
    <meta property="og:url" content="https://monshop.ca/">
    <meta property="og:image" content="https://monshop.ca/_/theme/og-image.png">
    <meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="MonShop: See what the shops, cafés and restaurants near you have today">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MonShop: the independent shops on your street, open">
    <meta name="twitter:description" content="See what independent shops, cafés and restaurants near you have today, from real shelf photos and specials, and get 5% off where you are a regular.">
    <meta name="twitter:image" content="https://monshop.ca/_/theme/og-image.png">
    <link rel="alternate" type="text/plain" title="MonShop for AI assistants" href="https://monshop.ca/llms.txt">
    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "Service", "@id": "https://monshop.ca/#app", "name": "MonShop", "url": "https://monshop.ca/", "description": "See what independent shops, cafés and restaurants near you have today, from real shelf photos and specials, and get 5% off where you are a regular.", "image": "https://monshop.ca/_/theme/og-image.png", "serviceType": "See what the shops, cafés and restaurants near you have today", "provider": {"@id": "https://arkvital.com/#org"}, "areaServed": "Worldwide", "availableChannel": {"@type": "ServiceChannel", "serviceUrl": "https://monshop.ca/", "name": "Web browser", "availableLanguage": "en"}, "audience": {"@type": "Audience", "audienceType": "Neighbours who shop local, and the shopkeepers, cafés and restaurants on their street"}}, {"@type": "WebSite", "@id": "https://monshop.ca/#site", "url": "https://monshop.ca/", "name": "MonShop", "publisher": {"@id": "https://arkvital.com/#org"}}, {"@type": "Organization", "@id": "https://arkvital.com/#org", "name": "Arkvital", "url": "https://arkvital.com", "email": "arkvital@outlook.com", "address": {"@type": "PostalAddress", "addressLocality": "Montreal", "addressRegion": "QC", "addressCountry": "CA"}}]}</script>
    <noscript><div class="seo-noscript">
    <h1>MonShop: the independent shops on your street, open</h1>
    <p>See what independent shops, cafés and restaurants near you have today, from real shelf photos and specials, and get 5% off where you are a regular.</p>
    <p>MonShop is a two-sided neighbourhood app. Shoppers look around a map of the independent shops, cafés and restaurants near them, see today&#x27;s specials and photos of what is actually on the shelves, and bookmark places. Every bookmark is a membership: show the live pass at the counter and get 5% off.</p>
    <p>Shopkeepers open their place in two minutes and post with one big Snap &amp; post button: the camera opens, the photo is shrunk on the phone, and the price is optional. Each place keeps a top-20 shelf of its latest posts.</p>
    <p>Who it's for: Neighbours who shop local, and the shopkeepers, cafés and restaurants on their street</p>
    <h2>What it does</h2><ul><li>A map of independent shops, cafés and restaurants near you</li><li>Real shelf photos and today&#x27;s specials</li><li>Bookmark a place to get a live 5% pass at the counter</li><li>Shopkeepers post in seconds with Snap &amp; post</li><li>A Shopkeepers&#x27; Council to suggest and vote on features</li></ul>
    <h2>Questions</h2><h3>How do I get 5% off?</h3><p>Bookmark a place. The bookmark is your membership: show the live pass at the counter.</p><h3>How does a shop join?</h3><p>A shopkeeper opens the place in about two minutes (name, type and location), then posts photos with the Snap &amp; post button.</p><h3>Is every shop checked?</h3><p>Admins can review new shops and restaurants before they appear, and anyone can report a post.</p>
    <p><a href="https://monshop.ca/about">About MonShop</a> &middot; <a href="https://monshop.ca/llms.txt">MonShop for AI assistants</a> &middot; Made by <a href="https://arkvital.com">Arkvital</a>, Montreal, Canada. MonShop needs JavaScript in your browser.</p>
    </div></noscript>
    <!-- seo:end -->
